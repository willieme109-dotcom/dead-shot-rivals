<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Dead Shot Rivals</title><link rel="stylesheet" href="style.css"></head><body>
<div id="player-bar" hidden><span id="player-name"></span><button id="logout-button">Log Out</button></div>
<div id="start-screen"><h1>Dead Shot Rivals</h1><p>3D multiplayer shooting game</p><div id="account-actions"><a href="login.html" class="button-link outline-button">Log In</a><a href="create-account.html" class="button-link">Create Account</a></div><p id="account-status">Log in or create an account to play.</p><button id="start-button" class="play-button" hidden>Enter Game</button><a class="admin-link" href="admin.html">Admin Panel</a></div>
<div id="crosshair" aria-hidden="true">+</div><div id="hud">Move: WASD &nbsp; | &nbsp; Look: Mouse</div>
<script>const player=localStorage.getItem('dsr-current-player');const enter=document.querySelector('#start-button');if(player){enter.hidden=false;enter.textContent='Enter Game as '+player;document.querySelector('#account-actions').classList.add('hidden');document.querySelector('#account-status').classList.add('hidden');document.querySelector('#player-bar').hidden=false;document.querySelector('#player-name').textContent=player;}enter.addEventListener('click',()=>location.href='lobby.html');document.querySelector('#logout-button').addEventListener('click',()=>{localStorage.removeItem('dsr-current-player');location.reload();});</script>
<script src="game.js"></script></body></html>
